<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>GitHub Pages Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 6vw, 4rem);
      border: 1px solid #e2e8f0;
      border-radius: 1.5rem;
      background: #fff;
      box-shadow: 0 24px 60px rgb(15 23 42 / 10%);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem .85rem;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-size: .9rem;
      font-weight: 650;
    }

    .dot {
      width: .55rem;
      height: .55rem;
      border-radius: 50%;
      background: #22c55e;
    }

    h1 {
      margin: 1.5rem 0 .75rem;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -.05em;
    }

    p {
      margin: 0 auto;
      max-width: 32rem;
      color: #475569;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    code {
      padding: .15rem .4rem;
      border-radius: .35rem;
      background: #f1f5f9;
      color: #334155;
      font-size: .95em;
    }

    footer {
      margin-top: 2rem;
      color: #64748b;
      font-size: .9rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot" aria-hidden="true"></span>Page is working</span>
    <h1>Hello from GitHub Pages!</h1>
    <p>This test page is being served from the repository’s <code>docs/</code> folder. If you can see this, the site is ready to configure in GitHub Pages settings.</p>
    <footer> Azyvo · GitHub Pages test </footer>
  </main>
</body>
</html>
